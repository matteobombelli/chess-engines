[package]
name = "alphamini"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A compact AlphaZero-style chess engine and self-play data producer"

[features]
default = []
onnx = ["dep:ort"]
cuda = ["onnx", "ort/copy-dylibs", "ort/cuda"]

[dependencies]
artifact-io = { path = "../artifact-io" }
axum = { version = "0.8", features = ["json"] }
chess-core = { path = "../chess-core" }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "alphamini"
path = "src/bin/server.rs"

[[bin]]
name = "alphamini-selfplay"
path = "src/bin/self_play.rs"

[[bin]]
name = "alphamini-fixtures"
path = "src/bin/fixtures.rs"

[[bin]]
name = "alphamini-inference"
path = "src/bin/inference.rs"
required-features = ["onnx"]
