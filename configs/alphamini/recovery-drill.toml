schema = "alphamini.config.v1"

[run]
name = "alphamini-recovery-drill"
description = "Disposable target-GPU collection and checkpoint recovery drill"
seed = 1
active_budget_hours = 0.1
disposable = true

[schemas]
position_record = "position-record-v1"
tensor_cache = "tensor-cache-manifest-v1"
encoder = "encoder-v1"
action = "policy-v1"
model_manifest = "model-manifest-v1"

[model]
input_planes = 22
action_size = 4672
channels = 16
residual_blocks = 1
se_hidden = 4

[self_play]
# Long enough for the driver to signal a live collector, but still bounded.
# Game 16 also guarantees at least one game-grouped validation assignment for
# the frozen seed/fraction below.
games_per_cycle = 24
simulations = 16
batch_size = 8
max_plies = 128
dirichlet_alpha = 0.3
dirichlet_epsilon = 0.25
sample_until_ply = 30
cpuct = 1.5
fpu_reduction = 0.25

[training]
batch_size = 8
# Produces hundreds of updates from one small cycle, leaving a reliable window
# after a durable checkpoint in which the driver can signal the orchestrator.
sample_ratio = 1.0
replay_positions = 8192
validation_fraction = 0.05
validation_batches = 8
learning_rate = 0.001
minimum_learning_rate = 0.0001
warmup_fraction = 0.02
frozen_horizon_steps = 4000
horizon_confirmed = true
weight_decay = 0.0001
gradient_clip = 1.0
checkpoint_every_steps = 25
device = "cuda"
amp = true
deterministic = true

[export]
opset = 17
dtype = "float32"
parity_atol = 0.0001
parity_rtol = 0.001

[operations]
self_play_device = "cuda"
collect_command = [
  "scripts/alphamini-cuda-runtime", "exec", "--", "cargo", "run", "--locked",
  "--release", "-p", "alphamini", "--bin", "alphamini-selfplay", "--features",
  "cuda", "--", "collect",
]
materialize_command = [
  "cargo", "run", "--locked", "--release", "-p", "alphamini", "--bin",
  "alphamini-selfplay", "--", "materialize",
]
heartbeat_seconds = 1
command_timeout_seconds = 120
