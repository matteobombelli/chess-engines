schema = "alphamini.config.v1"

[run]
name = "alphamini-pilot"
description = "Throwaway end-to-end correctness and throughput pilot"
seed = 1
active_budget_hours = 0.25
disposable = true

[schemas]
position_record = "position-record-v1"
tensor_cache = "tensor-cache-manifest-v1"
encoder = "encoder-v1"
action = "policy-v1"
model_manifest = "model-manifest-v1"

[model]
input_planes = 22
action_size = 4672
channels = 16
residual_blocks = 1
se_hidden = 4

[self_play]
games_per_cycle = 8
simulations = 16
batch_size = 8
max_plies = 128
dirichlet_alpha = 0.3
dirichlet_epsilon = 0.25
sample_until_ply = 30
cpuct = 1.5
fpu_reduction = 0.25

[training]
batch_size = 8
sample_ratio = 0.25
replay_positions = 4096
validation_fraction = 0.05
validation_batches = 4
learning_rate = 0.001
minimum_learning_rate = 0.0001
warmup_fraction = 0.02
frozen_horizon_steps = 1000
horizon_confirmed = true
weight_decay = 0.0001
gradient_clip = 1.0
checkpoint_every_steps = 10
device = "cuda"
amp = true
deterministic = true

[export]
opset = 17
dtype = "float32"
parity_atol = 0.0001
parity_rtol = 0.001

[operations]
# These are command prefixes. The orchestrator appends the versioned CLI arguments.
self_play_device = "cuda"
collect_command = ["scripts/alphamini-cuda-runtime", "exec", "--", "cargo", "run", "--locked", "--release", "-p", "alphamini", "--bin", "alphamini-selfplay", "--features", "cuda", "--", "collect"]
materialize_command = ["cargo", "run", "--locked", "--release", "-p", "alphamini", "--bin", "alphamini-selfplay", "--", "materialize"]
heartbeat_seconds = 30
command_timeout_seconds = 0
