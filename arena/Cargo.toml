[package]
name = "arena"
version = "0.1.0"
edition = "2024"

[features]
default = []
alphamini = ["dep:artifact-io", "alphamini/onnx"]
minigpt = ["dep:minigpt", "minigpt/onnx"]

[dependencies]
alphamini = { path = "../alphamini", default-features = false }
artifact-io = { path = "../artifact-io", optional = true }
chess-core = { path = "../chess-core" }
minigpt = { path = "../minigpt", optional = true, default-features = false }
minimax = { path = "../minimax" }
rand = "0.8"
random = { path = "../random" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
