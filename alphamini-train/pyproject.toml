[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "alphamini-train"
version = "0.1.0"
description = "Reproducible training and run operations for AlphaMini"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "AlphaMini contributors" }]
dependencies = [
  "msgpack==1.1.1",
  "numpy==2.2.6",
  "zstandard==0.23.0",
]

[project.optional-dependencies]
train = [
  "onnx==1.18.0",
  "onnxruntime==1.22.0",
  "torch==2.7.1",
]
test = ["pytest==8.4.1"]

[project.scripts]
alphamini-train = "alphamini_train.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphamini_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
package = true
